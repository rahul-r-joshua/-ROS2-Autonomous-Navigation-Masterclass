  <!-- Waypoint Markers (Exactly Centered On The Green Path Line) -->
  <g transform="translate(100.0, 120.0)">
    <circle r="8" fill="#58a6ff"/>
    <text x="14" y="5" fill="#58a6ff" font-size="12px" font-weight="900">START (0.0, 0.0)</text>
  </g>
  <g transform="translate(260.0, 380.0)">
    <circle r="6" fill="#d29922"/>
    <text x="12" y="4" fill="#d29922" font-size="11px" font-weight="700">W1</text>
  </g>
  <g transform="translate(400.0, 220.0)">
    <circle r="6" fill="#d29922"/>
    <text x="12" y="4" fill="#d29922" font-size="11px" font-weight="700">W2</text>
  </g>
  <g transform="translate(640.0, 500.0)">
    <circle r="10" fill="#f85149"/>
    <circle r="16" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="0" y="30" fill="#f85149" font-size="13px" font-weight="900" text-anchor="middle">GOAL (Target Pose)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- MOBILE ROBOT CHASSIS AT CURRENT POSITION (360, 380)                       -->
  <!-- ========================================================================= -->
  <g transform="translate(360, 380)">
    <!-- Yellow Slowdown Safety Zone (r = 105px) -->
    <circle r="105" fill="#d29922" fill-opacity="0.14" stroke="#d29922" stroke-width="2" stroke-dasharray="6,4" style="animation: pulseYellowZone 2.5s ease-in-out infinite;"/>

    <!-- Red Emergency Stop Safety Zone (r = 52px) -->
    <circle r="52" fill="#f85149" fill-opacity="0.22" stroke="#f85149" stroke-width="2.5" style="animation: pulseRedZone 2s ease-in-out infinite;"/>

    <!-- AMCL Particle Cloud Cluster (Cyan Dots) -->
    <g opacity="0.8">
      <circle cx="-12" cy="-8" r="1.8" fill="#58a6ff"/>
      <circle cx="8" cy="-14" r="1.5" fill="#58a6ff"/>
      <circle cx="-6" cy="12" r="2.0" fill="#79c0ff"/>
      <circle cx="14" cy="9" r="1.6" fill="#58a6ff"/>
      <circle cx="-18" cy="4" r="1.4" fill="#58a6ff"/>
      <circle cx="16" cy="-6" r="1.7" fill="#79c0ff"/>
      <circle cx="-2" cy="-16" r="1.9" fill="#58a6ff"/>
      <circle cx="7" cy="18" r="1.5" fill="#58a6ff"/>
    </g>

    <!-- Rotating Radar Sweep Beam -->
    <g style="transform-origin: 0px 0px; animation: radarRotate 4s linear infinite;">
      <path d="M 0 0 L 100 0 A 100 100 0 0 1 70 70 Z" fill="url(#sweep_grad)"/>
      <line x1="0" y1="0" x2="100" y2="0" stroke="#58a6ff" stroke-width="2" opacity="0.8"/>
    </g>

    <!-- Robot Base Chassis (0.40m x 0.30m Box) -->
    <rect x="-30" y="-22" width="60" height="44" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2.5"/>
    <!-- Wheels -->
    <rect x="-24" y="-27" width="16" height="6" rx="2" fill="#30363d"/>
    <rect x="8" y="-27" width="16" height="6" rx="2" fill="#30363d"/>
    <rect x="-24" y="21" width="16" height="6" rx="2" fill="#30363d"/>
    <rect x="8" y="21" width="16" height="6" rx="2" fill="#30363d"/>
    <!-- LiDAR Puck & Heading Indicator -->
    <circle cx="0" cy="0" r="11" fill="#1f6feb" stroke="#ffffff" stroke-width="1.5"/>
    <polygon points="12,0 0,-5 0,5" fill="#58a6ff"/>
    <!-- Lookahead Vector to Pure Pursuit Target Point -->
    <line x1="0" y1="0" x2="65" y2="0" stroke="#3fb950" stroke-width="2" stroke-dasharray="3,3"/>
    <circle cx="65" cy="0" r="4" fill="#3fb950"/>
  </g>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT HUD & TELEMETRY DASHBOARD PANEL (WITH CRISP VECTOR ICONS)          -->
  <!-- ========================================================================= -->
  <g transform="translate(830, 65)">
    <!-- Dashboard Outer Card -->
    <rect width="330" height="585" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>

    <!-- Section 1: Navigation Status -->
