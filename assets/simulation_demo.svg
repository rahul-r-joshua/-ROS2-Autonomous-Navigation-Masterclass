  <path d="M 100.0 120.0 L 100.3 127.1 L 100.6 134.3 L 100.8 141.4 L 101.0 148.5 L 101.1 155.7 L 101.2 162.8 L 101.2 169.9 L 101.2 177.1 L 101.1 184.2 L 101.0 191.4 L 100.8 198.5 L 100.6 205.7 L 100.3 212.9 L 100.0 220.0 L 99.6 227.2 L 99.2 234.3 L 98.7 241.5 L 98.2 248.7 L 97.7 255.9 L 97.0 263.0 L 96.5 270.2 L 96.3 277.4 L 96.4 284.5 L 96.9 291.6 L 97.8 298.7 L 99.1 305.8 L 100.7 312.9 L 102.7 319.9 L 105.1 326.9 L 107.8 333.9 L 110.9 340.9 L 114.4 347.5 L 118.4 353.5 L 123.0 358.8 L 128.0 363.5 L 133.6 367.5 L 139.6 370.8 L 146.2 373.4 L 153.3 375.4 L 160.6 377.0 L 167.9 378.3 L 175.1 379.4 L 182.4 380.3 L 189.6 380.9 L 196.8 381.3 L 204.0 381.4 L 211.1 381.4 L 218.2 381.1 L 225.3 380.7 L 232.5 380.3 L 239.6 380.1 L 246.7 380.0 L 253.8 379.9 L 260.9 380.0 L 268.1 380.2 L 275.2 380.5 L 282.3 380.9 L 289.5 381.4 L 296.6 382.0 L 303.8 382.8 L 310.9 383.4 L 318.1 383.7 L 325.2 383.5 L 332.4 383.0 L 339.5 382.1 L 346.7 380.8 L 353.8 379.0 L 361.0 376.9 L 368.1 374.4 L 375.2 371.5 L 381.5 367.9 L 386.8 363.6 L 391.1 358.6 L 394.4 352.8 L 396.7 346.4 L 398.1 339.3 L 398.7 331.6 L 399.2 324.0 L 399.7 316.5 L 400.1 309.0 L 400.4 301.6 L 400.7 294.3 L 400.9 287.0 L 401.1 279.8 L 401.2 272.7 L 401.2 265.6 L 401.2 258.6 L 401.2 251.6 L 401.0 244.6 L 400.8 237.5 L 400.5 230.4 L 400.2 223.3 L 399.8 216.2 L 399.3 209.0 L 398.7 201.8 L 398.1 194.6 L 397.4 187.4 L 397.2 180.3 L 397.6 173.1 L 398.6 166.1 L 400.3 159.0 L 402.5 152.0 L 405.4 145.1 L 408.9 138.3 L 413.1 132.4 L 417.9 127.5 L 423.6 123.8 L 429.9 121.2 L 436.9 119.7 L 444.4 119.1 L 451.9 118.5 L 459.3 118.0 L 466.7 117.7 L 474.0 117.4 L 481.3 117.3 L 488.5 117.2 L 495.7 117.2 L 502.8 117.4 L 509.9 117.6 L 516.9 117.7 L 524.0 117.9 L 531.0 118.0 L 538.1 118.0 L 545.1 118.0 L 552.2 118.0 L 559.2 117.9 L 566.3 117.8 L 573.3 117.6 L 580.4 117.4 L 587.4 117.2 L 594.4 116.9 L 601.5 116.7 L 608.6 116.6 L 615.8 116.7 L 623.1 116.9 L 630.4 117.3 L 637.9 117.8 L 645.4 118.5 L 652.9 119.3 L 660.5 120.3 L 668.1 121.5 L 675.0 123.6