    <circle cx="34" cy="36" r="7" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
    <polygon points="34,31 32,36 36,36" fill="#f85149"/>
    <text x="48" y="40" fill="#58a6ff" font-size="14px" font-weight="900">Nav2 Simple Commander</text>
    <text x="30" y="65" fill="#f0f6fc" font-size="13px" font-weight="700">Lifecycle State: <tspan fill="#3fb950">ACTIVE</tspan></text>
    <text x="30" y="88" fill="#c9d1d9" font-size="12px">BT Replanning Rate: <tspan fill="#58a6ff">1.0 Hz</tspan></text>
    <text x="30" y="108" fill="#8b949e" font-size="12px">Active Node: <tspan fill="#bc8cff">FollowPath</tspan></text>

    <!-- Section 2: Custom C++ Plugins -->
    <rect x="15" y="135" width="300" height="115" rx="8" fill="#0d1117" stroke="#8957e5" stroke-width="1.5"/>
    <rect x="28" y="150" width="12" height="12" rx="2" fill="#24143a" stroke="#bc8cff" stroke-width="1.5"/>
    <circle cx="34" cy="156" r="2.5" fill="#bc8cff"/>
    <text x="48" y="160" fill="#bc8cff" font-size="14px" font-weight="900">Custom C++ Plugins (M7/M8)</text>
    <text x="30" y="185" fill="#c9d1d9" font-size="12px">Global Planner: <tspan fill="#58a6ff" font-weight="700">AStarPlanner</tspan></text>
    <text x="30" y="208" fill="#c9d1d9" font-size="12px">Local Controller: <tspan fill="#3fb950" font-weight="700">PurePursuit</tspan></text>
    <text x="30" y="232" fill="#8b949e" font-size="11px">Lookahead: <tspan fill="#ffffff">0.45m</tspan> • Curvature: <tspan fill="#ffffff">0.24 rad/m</tspan></text>

    <!-- Section 3: Active LiDAR Safety Zones -->
    <rect x="15" y="265" width="300" height="135" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="1.5"/>
    <path d="M 34 278 L 40 278 L 40 286 L 34 290 L 28 286 L 28 278 Z" fill="#f85149"/>
    <text x="48" y="290" fill="#f85149" font-size="14px" font-weight="900">Active LiDAR Safety Zones</text>
    <text x="30" y="315" fill="#c9d1d9" font-size="12px">Safety Status: <tspan fill="#3fb950" font-weight="700">● NOMINAL (Clear)</tspan></text>
    <circle cx="35" cy="334" r="4.5" fill="#f85149"/>
    <text x="46" y="338" fill="#ff7b72" font-size="12px">Stop Zone: <tspan fill="#ffffff">d ≤ 0.45m (E-Stop)</tspan></text>
    <circle cx="35" cy="356" r="4.5" fill="#d29922"/>
    <text x="46" y="360" fill="#d29922" font-size="12px">Slow Zone: <tspan fill="#ffffff">d ≤ 0.90m (50% Speed)</tspan></text>
    <text x="30" y="385" fill="#8b949e" font-size="11px">Twist Mux: <tspan fill="#58a6ff">/cmd_vel_nav (P50)</tspan></text>

    <!-- Section 4: Live Telemetry -->
    <rect x="15" y="415" width="300" height="155" rx="8" fill="#0d1117" stroke="#238636" stroke-width="1.5"/>
    <rect x="28" y="434" width="3" height="6" fill="#3fb950"/>
    <rect x="33" y="430" width="3" height="10" fill="#3fb950"/>
    <rect x="38" y="426" width="3" height="14" fill="#3fb950"/>
    <text x="48" y="440" fill="#3fb950" font-size="14px" font-weight="900">Live Telemetry &amp; EKF Fusion</text>
    <text x="30" y="465" fill="#c9d1d9" font-size="12px">Linear Speed v: <tspan fill="#58a6ff" font-weight="700">0.32 m/s</tspan></text>
    <text x="30" y="488" fill="#c9d1d9" font-size="12px">Angular Speed ω: <tspan fill="#58a6ff" font-weight="700">0.08 rad/s</tspan></text>
    <text x="30" y="511" fill="#c9d1d9" font-size="12px">Distance to Goal: <tspan fill="#d29922" font-weight="700">1.64 m</tspan></text>
    <text x="30" y="534" fill="#c9d1d9" font-size="12px">AMCL Particles: <tspan fill="#3fb950">1,250 (Converged)</tspan></text>
    <text x="30" y="556" fill="#8b949e" font-size="11px">Pose: x=2.15, y=1.40, yaw=42°</text>
  </g>
</svg>